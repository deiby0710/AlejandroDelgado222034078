<form (ngSubmit)="enviarDatos()" #formulario="ngForm">
  <div class="flex flex-column justify-content-center">
    <app-user (datosCapturados)="capturarDatosUsuario($event)"></app-user>
    <app-agent (datosCapturados)="capturarDatosVendedor($event)"></app-agent>
    <app-date (datosCapturados)="capturarDatosFechas($event)"></app-date>
    <!-- <button type="submit" (click)="prueba()">Enviar</button> -->
  </div>
</form>
